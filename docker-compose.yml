# ---------------------------------------------------------------------------
# Docker Compose for DDCPL Tender Monitor
# Services: app, postgres, redis (+ optional worker/https profiles)
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: gem-monitor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gem}
      POSTGRES_DB: ${POSTGRES_DB:-gem_website}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      # Localhost-only: never expose Postgres to the internet
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem_website"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gem-monitor-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gem-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gem-monitor-app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://gem:gem@postgres:5432/gem_website?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CRON_SECRET: ${CRON_SECRET:-}
      SCAN_ENABLED: "true"
      SOURCE_DEMO_MODE: "false"
      REQUEST_DELAY_MS: "1250"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gem-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Optional: Cron worker for scheduled scans
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gem-monitor-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://gem:gem@postgres:5432/gem_website?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SCAN_ENABLED: "true"
      SOURCE_DEMO_MODE: "false"
      SCAN_CRON: "*/10 * * * *"  # Every 10 minutes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gem-network
    restart: unless-stopped
    profiles:
      - with-worker
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Optional: HTTPS reverse proxy (DuckDNS/Let's Encrypt) — profile: https
  caddy:
    image: caddy:2-alpine
    container_name: gem-monitor-caddy
    profiles:
      - https
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - gem-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  gem-network:
    driver: bridge